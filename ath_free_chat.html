<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>چت</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/ath_free_chat.css" />
    <link rel="stylesheet" href="/css/ath_free_lock.css" />
  </head>
  <body>
    <main class="chat-page">
      <header class="chat-header">
        <div class="tabs" role="tablist">
          <button class="tab active" data-target="coach" role="tab">
            مربی من
          </button>
          <button class="tab" data-target="forum" role="tab">
            تالار گفت‌وگو
          </button>
        </div>
      </header>

      <section class="panel active" id="coach">
        <div class="peer">
          <div class="avatar">ع</div>
          <div>
            <div class="peer-name" id="coachPeerName">مربی من</div>
            <div class="peer-status" id="coachPeerStatus">در حال بارگذاری…</div>
          </div>
        </div>

        <div class="messages" id="coachMessages"></div>

        <form class="composer" data-list="coachMessages" data-priority="true">
          <button
            type="button"
            class="priority-btn lock-badge"
            data-premium="ارسال پیام اولویت‌دار"
            title="پیام اولویت‌دار (Premium)"
            aria-pressed="false"
          >
            ★
          </button>
          <input
            type="text"
            placeholder="پیام خود را بنویسید…"
            aria-label="پیام"
          />
          <button type="submit" class="send-btn" aria-label="ارسال">➤</button>
        </form>
      </section>

      <section class="panel" id="forum">
        <div class="peer">
          <div class="avatar group">گ</div>
          <div>
            <div class="peer-name">تالار گفت‌وگو</div>
            <select id="forumSelect" class="forum-select" aria-label="انتخاب تالار"></select>
          </div>
        </div>

        <div class="messages" id="forumMessages"></div>

        <form class="composer" data-list="forumMessages">
          <input
            type="text"
            placeholder="پیام به گروه…"
            aria-label="پیام به گروه"
          />
          <button type="submit" class="send-btn" aria-label="ارسال">➤</button>
        </form>
      </section>
    </main>

    <div class="footer">
      <div class="selected">
        <img src="./icons/comments (1).svg" alt="چت" />
      </div>

      <div class="icon">
        <a href="./ath_free_exercise.html">
          <img src="./icons/dumbbell-ray.png" alt="تمرین" />
        </a>
      </div>

      <div class="icon">
        <a href="./ath_free_diet.html">
          <img src="./icons/hamburger-soda.png" alt="تغذیه" />
        </a>
      </div>

      <div class="icon">
        <a href="./ath_free_user.html">
          <img src="./icons/user.png" alt="پروفایل" />
        </a>
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/ath_free_common.js"></script>
    <script src="/js/ath_free_chat.js"></script>
  </body>
</html>
